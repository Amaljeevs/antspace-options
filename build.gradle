plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.8' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

group = 'com.finquant'
version = '0.1.0'

ext {
    springBootVersion = '3.4.8'
    springCloudVersion = '2024.0.2'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.finquant'
    version = '0.1.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

project(':backend:common') {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'com.fasterxml.jackson.core:jackson-databind'
    }
}

[
    project(':backend:auth-server'),
    project(':backend:api-gateway'),
    project(':backend:order-engine'),
    project(':backend:portfolio-service'),
    project(':backend:broker-service')
].each { module ->
    module.apply plugin: 'org.springframework.boot'

    module.dependencies {
        implementation project(':backend:common')
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}
